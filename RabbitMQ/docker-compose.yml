version: '3'

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      # the environment variables RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS are used for both the RabbitMQ broker and the management plugin.
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"

networks:
  default:
    driver: bridge
